name: Fix UAB roster storage paths

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-uab-roster-paths.yml'

permissions:
  contents: write

jobs:
  fix-uab-roster-paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Point UAB roster services at Opponents/UAB
        shell: python
        run: |
          from pathlib import Path

          files = [
              Path('api/sync-roster-uab.js'),
              Path('api/enrich-roster-uab.js'),
          ]
          old = "const OBJECT_PATH = '2026/Week2_UAB/roster.json';"
          new = "const OBJECT_PATH = 'Opponents/UAB/roster.json';"

          for path in files:
              text = path.read_text(encoding='utf-8')
              if new in text:
                  print(f'{path}: already correct')
                  continue
              if old not in text:
                  raise SystemExit(f'{path}: expected old roster path not found')
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
              print(f'{path}: updated')

      - name: Commit corrected UAB roster paths
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/sync-roster-uab.js api/enrich-roster-uab.js
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Use Opponents UAB roster for sync and enrichment"
          git push origin HEAD:main
