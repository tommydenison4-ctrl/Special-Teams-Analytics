name: Debug Southeastern roster bootstrap

on:
  push:
    paths:
      - '.github/workflows/debug-sela-bootstrap.yml'

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect root prep opponent logic
        shell: bash
        run: |
          set -euo pipefail
          echo '--- selector ---'
          grep -n -C 3 'prepOpponentF' index.html | head -80 || true
          echo '--- configs ---'
          grep -n -A80 -B5 'const PREP_OPPONENTS' index.html | head -150 || true
          echo '--- load function ---'
          grep -n -A110 -B5 'async function loadPrepOpponentData' index.html | head -180 || true
          echo '--- active PFF files ---'
          grep -n -A55 -B5 'function activePffFiles' index.html | head -120 || true
          echo '--- prep opponent conditionals ---'
          grep -n -E "prepOpponent===|prepOpponent!==" index.html | head -160 || true
