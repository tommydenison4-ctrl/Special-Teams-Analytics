name: Debug Southeastern roster bootstrap

on:
  push:
    paths:
      - '.github/workflows/debug-sela-bootstrap.yml'

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit Southeastern Player Intelligence identity filtering
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, csv, io, urllib.request

          s=Path('index.html').read_text(errors='ignore')
          names=[
            'function loadPrepOpponentData',
            'function returnerFullStats',
            'function specialistFullStats',
            'function kickoffTacklerStats',
            'function puntTacklerStats',
            'function rosterByNumber',
            'function strictIdentityCheck',
            'function cardForCategory',
            'function playerPage'
          ]
          for name in names:
              i=s.find(name)
              print('\n===== ',name,' @ ',i,' =====')
              if i>=0: print(s[i:i+7000])

          for needle in ['Opponents/SoutheasternLA','LASE','prepOpponent','historicalRoster']:
              print('\n===== OCCURRENCES',needle,'=====')
              for m in list(re.finditer(re.escape(needle),s,re.I))[:35]:
                  a=max(0,m.start()-350); b=min(len(s),m.end()+900)
                  print(s[a:b].replace('\n',' '))

          base='https://hzrosmevuejjlxigdxmg.supabase.co/storage/v1/object/public/Special%20Teams/Opponents/SoutheasternLA/'
          targets=['Tylin Jackson','Bradley Wainwright','EJ Reid','AJ Johnson']
          for fn in ['offensive-side.csv','defensive-side.csv']:
              print('\n===== CSV',fn,'=====')
              raw=urllib.request.urlopen(base+fn,timeout=30).read().decode('utf-8-sig','replace')
              rows=list(csv.DictReader(io.StringIO(raw)))
              print('rows',len(rows),'columns',list(rows[0].keys()) if rows else [])
              for target in targets:
                  hits=[]
                  for idx,row in enumerate(rows):
                      joined=' | '.join(str(v or '') for v in row.values())
                      if target.lower() in joined.lower():
                          hits.append((idx,row))
                  print('TARGET',target,'hits',len(hits))
                  for idx,row in hits[:8]:
                      interesting={k:v for k,v in row.items() if v and any(x in k.upper() for x in ['TEAM','PLAYER','GAME','WEEK','SEASON','PLAYID','KICK','PUNT','RETURN'])}
                      print(idx,interesting)
          PY
