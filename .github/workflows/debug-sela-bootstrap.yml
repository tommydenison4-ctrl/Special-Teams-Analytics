name: Debug Southeastern roster bootstrap

on:
  push:
    paths:
      - '.github/workflows/debug-sela-bootstrap.yml'

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect official player profile HTML
        shell: bash
        run: |
          set -euo pipefail
          URL='https://lionsports.net/sports/football/roster/kyree-paul/11721'
          curl -LfsS -A 'Mozilla/5.0' "$URL" -o /tmp/profile.html
          wc -c /tmp/profile.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('/tmp/profile.html').read_text(errors='ignore')
          for needle in ['2025 (Freshman)','Career Notes','sidearm-roster-player-bio','Istrouma']:
              print('needle',needle,'count',s.count(needle))
              i=s.find(needle)
              if i>=0:
                  chunk=re.sub(r'\s+',' ',s[max(0,i-2500):i+5000])
                  print(chunk[:7500])
                  print('---')
          PY
