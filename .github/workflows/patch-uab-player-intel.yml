name: Patch UAB Player Intelligence depth roster

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-uab-player-intel.yml'

permissions:
  contents: write

jobs:
  patch-uab-player-intel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add UAB depth-chart players to Player Intelligence
        shell: python
        run: |
          from pathlib import Path

          path = Path('uab/index.html')
          text = path.read_text(encoding='utf-8')
          marker = 'UAB_PLAYER_INTEL_DEPTH_PATCH'
          if marker in text:
              print('UAB Player Intelligence depth patch already present.')
              raise SystemExit(0)

          anchor = "      // Replace only the Week 1 hard-coded depth-chart renderer. Chart Looks,\n"
          if anchor not in text:
              raise SystemExit('Could not find safe UAB wrapper insertion anchor.')

          patch = Path('scripts/uab-player-intel-patch.txt').read_text(encoding='utf-8')
          text = text.replace(anchor, patch + anchor, 1)
          path.write_text(text, encoding='utf-8')
          print('Patched uab/index.html')

      - name: Commit UAB Player Intelligence patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uab/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Show UAB depth chart players in Player Intelligence"
          git push origin HEAD:main
