name: Dump root player intel
on:
  push:
    paths:
      - '.github/workflows/dump-root-player-intel.yml'
permissions:
  contents: write
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract relevant functions
        shell: python
        run: |
          from pathlib import Path
          s=Path('index.html').read_text(errors='ignore')
          names=['function loadPrepOpponentData','function returnerFullStats','function specialistFullStats','function kickoffTacklerStats','function puntTacklerStats','function rosterByNumber','function strictIdentityCheck','function cardForCategory','function playerPage','function playerPhoto','function currentTeamCode','function activeTeamCode']
          out=[]
          for name in names:
              i=s.find(name)
              out.append('\n===== '+name+' @ '+str(i)+' =====\n')
              if i>=0: out.append(s[i:i+14000])
          for needle in ['prepOpponent','prepAnalyticsRows','teamSettings.teamCode','rawTeam','historicalRosters']:
              out.append('\n===== OCCURRENCES '+needle+' =====\n')
              pos=0
              for _ in range(30):
                  i=s.find(needle,pos)
                  if i<0: break
                  out.append(s[max(0,i-500):min(len(s),i+1800)])
                  pos=i+len(needle)
          Path('debug-root-player-intel.txt').write_text('\n'.join(out))
      - name: Commit dump
        shell: bash
        run: |
          git config user.name 'tommydenison4-ctrl'
          git config user.email 'tommydenison4@gmail.com'
          git add debug-root-player-intel.txt
          git commit -m 'Add root Player Intelligence debug dump'
          git push origin main
