name: Inspect UAB historical photo render path

on:
  push:
    paths:
      - '.github/workflows/patch-uab-visible-player-photos-now.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print relevant Week 2 template code
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('uab/week2-template.html').read_text(errors='replace')
          for needle in ['historicalPlayerForPffToken','verifiedPffIdentity','unitTacklerStats','playerIntelCard','playerCard','p.image','image||']:
              print('\n===== '+needle+' =====')
              start=0
              hits=0
              while True:
                  i=s.find(needle,start)
                  if i<0 or hits>=4: break
                  print(s[max(0,i-1800):min(len(s),i+3000)])
                  start=i+len(needle); hits+=1
          PY
