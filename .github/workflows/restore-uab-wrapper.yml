name: Restore stable UAB wrapper
on:
  push:
    paths:
      - '.github/workflows/restore-uab-wrapper.yml'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          git show b0d83851addc438b068da12d26cdf874dc3da4ea:uab/index.html > uab/index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uab/index.html
          git commit -m "Restore stable UAB wrapper"
          git push
