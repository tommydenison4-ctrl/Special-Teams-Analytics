name: Add UAB photo refresh button

on:
  push:
    paths:
      - '.github/workflows/add-uab-photo-button.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch files
        run: python3 scripts/add-uab-photo-button.py
      - name: Verify patch
        run: |
          grep -q "refreshUabPhotosBtn" uab/index.html
          grep -q "publicUabRefresh" api/enrich-roster-uab.js
          grep -q "PHOTO_REFRESH_VERSION" api/enrich-roster-uab.js
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uab/index.html api/enrich-roster-uab.js
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Add visible UAB player photo refresh button"
            git push
          fi
