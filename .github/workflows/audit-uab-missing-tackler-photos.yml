name: Audit missing UAB tackler photos

on:
  push:
    paths:
      - '.github/workflows/audit-uab-missing-tackler-photos.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Find punt and kickoff tacklers missing roster photos
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv, io, json, re, urllib.request
          base='https://hzrosmevuejjlxigdxmg.supabase.co/storage/v1/object/public/Special%20Teams/Opponents/UAB'
          def get(path):
              with urllib.request.urlopen(base+'/'+path, timeout=60) as r:
                  return r.read().decode('utf-8-sig')
          roster=json.loads(get('roster.json'))
          players=roster if isinstance(roster,list) else roster.get('players',[])
          rows=[]
          for fn in ('offensive-side.csv','defensive-side.csv'):
              rows += list(csv.DictReader(io.StringIO(get(fn))))
          def val(r,k): return str(r.get(k,'') or '').strip()
          def labels(cell):
              s=str(cell or '').strip()
              if not s: return []
              # PFF cells are usually one label, but tolerate separators.
              out=[]
              for x in re.split(r'[;|,]+',s):
                  x=x.strip()
                  if x and x not in out: out.append(x)
              return out
          def token(label):
              m=re.search(r'(?:^|\s)([DS]?)(\d{1,2})$',str(label).strip(),re.I)
              return (m.group(1).upper(), str(int(m.group(2)))) if m else ('','')
          def posgrp(pos):
              p=str(pos or '').upper().strip()
              if p in {'P','PT','PK','K','KO','LS','SN'}: return 'S'
              if p in {'QB','RB','FB','WR','TE','OL','OT','OG','G','C'}: return 'O'
              if p in {'LB','ILB','OLB','DB','CB','S','FS','SS','DL','DE','DT','NT','EDGE'}: return 'D'
              return ''
          bynum={}
          for p in players:
              n=str(p.get('number','')).lstrip('0') or '0'
              bynum.setdefault(n,[]).append(p)
          phases={'PUNT':('pff_OFFTEAM','pff_OFFPLAYERS'),'KICKOFF':('pff_DEFTEAM','pff_DEFPLAYERS')}
          for phase,(teamfield,playerfield) in phases.items():
              counts={}
              for r in rows:
                  if val(r,'pff_SPECIALTEAMSTYPE').upper()!=phase: continue
                  if val(r,teamfield).upper()!='ALBI': continue
                  active=set(re.split(r'[;|,]+', val(r,playerfield)))
                  active={x.strip() for x in active if x.strip()}
                  for fld in ('pff_TACKLE','pff_TACKLEASSIST'):
                      for lab in labels(val(r,fld)):
                          if active and lab not in active: continue
                          counts[lab]=counts.get(lab,0)+1
              print('\n###',phase,'TACKLERS')
              for lab,c in sorted(counts.items(), key=lambda kv:(-kv[1],kv[0])):
                  pref,num=token(lab)
                  candidates=bynum.get(num,[])
                  if pref:
                      pg='D' if pref=='D' else 'S' if pref=='S' else 'O'
                      filt=[p for p in candidates if posgrp(p.get('position'))==pg]
                      if filt: candidates=filt
                  if len(candidates)==1:
                      p=candidates[0]
                      print(json.dumps({'label':lab,'tackles':c,'number':num,'name':p.get('name'),'position':p.get('position'),'hasImage':bool(p.get('image')),'image':p.get('image','')}))
                  else:
                      print(json.dumps({'label':lab,'tackles':c,'number':num,'matches':[{'name':p.get('name'),'position':p.get('position'),'hasImage':bool(p.get('image'))} for p in candidates]}))
          PY
