name: Audit current UAB Illinois special teams rows

on:
  push:
    paths:
      - '.github/workflows/audit-uab-missing-tackler-photos.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Illinois rows already in Supabase
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv, io, json, urllib.request
          base='https://hzrosmevuejjlxigdxmg.supabase.co/storage/v1/object/public/Special%20Teams/Opponents/UAB'
          def get(path):
              with urllib.request.urlopen(base+'/'+path, timeout=60) as r:
                  return r.read().decode('utf-8-sig')
          key_fields=['pff_PLAYID','pff_GAMEDATE','pff_SPECIALTEAMSTYPE','pff_OFFTEAM','pff_DEFTEAM','pff_KICKRESULT','pff_KICKYARDS','pff_HANGTIME','pff_OPERATIONTIME','pff_KICKDIRECTIONACTUAL','pff_KICKDIRECTIONINTENDED','pff_RETURNDIRECTION','pff_RETURNYARDS','pff_TACKLE','pff_TACKLEASSIST','pff_OFFPLAYERS','pff_DEFPLAYERS']
          for fn in ('offensive-side.csv','defensive-side.csv'):
              rows=list(csv.DictReader(io.StringIO(get(fn))))
              ill=[r for r in rows if str(r.get('pff_GAMEDATE','')).startswith('2026-09-03') or 'ILUN' in (str(r.get('pff_OFFTEAM',''))+str(r.get('pff_DEFTEAM','')))]
              print('\nFILE',fn,'TOTAL',len(rows),'ILLINOIS_ROWS',len(ill))
              for r in ill:
                  rec={k:r.get(k,'') for k in key_fields}
                  rec['nonempty_fields']=sum(1 for v in r.values() if str(v or '').strip())
                  print(json.dumps(rec,ensure_ascii=False))
          PY
