name: Enable Vercel Web Analytics
on:
  push:
    branches: [main]
    paths: ['.github/workflows/enable-vercel-web-analytics.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject analytics script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='/_vercel/insights/script.js'
          snippet='''\n<script>window.va=window.va||function(){(window.vaq=window.vaq||[]).push(arguments);};</script>\n<script defer src="/_vercel/insights/script.js"></script>\n'''
          if marker not in s:
              if '</body>' in s: s=s.replace('</body>',snippet+'</body>',1)
              elif '</head>' in s: s=s.replace('</head>',snippet+'</head>',1)
              else: s+=snippet
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/enable-vercel-web-analytics.yml
          git add index.html
          git diff --cached --quiet || git commit -m "Add Vercel Web Analytics"
          git push
