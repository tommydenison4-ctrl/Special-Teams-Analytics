name: Fix Southeastern player images and week navigation

on:
  push:
    paths:
      - '.github/workflows/fix-sela-images-week-toggle.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch image extraction and week navigation
        shell: python
        run: |
          from pathlib import Path
          import re

          # 1) Southeastern roster sync: profile links stay locked to lionsports.net,
          # but official Sidearm/CDN player photos are allowed.
          p = Path('lib/sela-sync.js')
          s = p.read_text()
          new_sync = """function highResImage(value, pageUrl) {
            if (!value) return '';
            try {
              const url = new URL(value, pageUrl);
              const host = url.hostname.toLowerCase();
              const allowed = host === OFFICIAL_HOST || host.endsWith('.sidearmdev.com') || host.endsWith('.cloudfront.net');
              if (!allowed) return '';
              url.searchParams.delete('width');
              return url.href;
            } catch {
              return '';
            }
          }"""
          s2, n = re.subn(r"function highResImage\(value, pageUrl\) \{[\s\S]*?\n\}", new_sync, s, count=1)
          if n != 1:
            raise SystemExit('sync highResImage block not found')
          p.write_text(s2)

          # 2) Southeastern enrichment: force every profile through a fresh image pass.
          p = Path('lib/sela-enrich.js')
          s = p.read_text()
          s = re.sub(r"const BIO_REFRESH_VERSION = '[^']+';", "const BIO_REFRESH_VERSION = 'sela-bios-2026-09-12-v3-photo-fix';", s, count=1)
          new_enrich = """function highResImage(raw, pageUrl) {
            if (!raw) return '';
            try {
              const url = new URL(raw, pageUrl);
              const host = url.hostname.toLowerCase();
              const allowed = host === OFFICIAL_HOST || host.endsWith('.sidearmdev.com') || host.endsWith('.cloudfront.net');
              if (!allowed) return '';
              url.searchParams.delete('width');
              return url.href;
            } catch {
              return '';
            }
          }"""
          s, n = re.subn(r"function highResImage\(raw, pageUrl\) \{[\s\S]*?\n\}", new_enrich, s, count=1)
          if n != 1:
            raise SystemExit('enrich highResImage block not found')
          s = s.replace("const tags = html.match(/<img\\b[^>]*>/gi) || [];", "const tags = html.match(/<(?:img|source)\\b[^>]*>/gi) || [];", 1)
          s = s.replace(
            "const raw = attr(tag, 'data-src') || attr(tag, 'data-original') || attr(tag, 'data-lazy-src') || attr(tag, 'src');\n    const candidate = highResImage(raw, profile.href);",
            "let raw = attr(tag, 'data-src') || attr(tag, 'data-original') || attr(tag, 'data-lazy-src') || attr(tag, 'src') || attr(tag, 'srcset');\n    if (raw && raw.includes(',')) { const parts = raw.split(',').map(x => x.trim().split(/\\s+/)[0]).filter(Boolean); raw = parts[parts.length - 1] || raw; }\n    const candidate = highResImage(raw, profile.href);",
            1
          )
          p.write_text(s)

          # 3) Restore the week buttons. The live header has extra classes on
          # ulmHeaderActions, so exact-string matching misses it.
          for filename in ['uab/index.html', 'southeastern/index.html']:
            p = Path(filename)
            s = p.read_text()
            pattern = re.compile(r"\s*if \(html\.includes\('<div class=\\\"ulmHeaderActions\\\">'\)\) \{[\s\S]*?html = html\.replace\('</body>', '<div style=\\\"position:fixed;right:14px;top:14px;z-index:20000\\\">' \+ weekButton \+ '</div></body>'\);\n\s*\}")
            replacement = """
              const weekActionsRe = /<div class=\"ulmHeaderActions([^\"]*)\">/i;
              if (weekActionsRe.test(html)) {
                html = html.replace(weekActionsRe, (match) => match + weekButton);
              } else {
                html = html.replace('</body>', '<div style=\"position:fixed;right:14px;top:14px;z-index:20000;display:flex;gap:8px\">' + weekButton + '</div></body>');
              }"""
            s2, n = pattern.subn(replacement, s, count=1)
            if n != 1:
              raise SystemExit(f'week nav block not found in {filename}')
            p.write_text(s2)

      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/sela-sync.js lib/sela-enrich.js uab/index.html southeastern/index.html
          git commit -m 'Fix Southeastern photos and restore week navigation'
          git push

      - name: Wait for Vercel to deploy photo fix
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            RESP=$(curl -fsS --retry 1 'https://special-teams-analytics.vercel.app/api/sela?route=enrich' || true)
            echo "$RESP"
            if echo "$RESP" | grep -q 'v3-photo-fix'; then exit 0; fi
            sleep 10
          done
          echo 'Timed out waiting for Vercel deployment' >&2
          exit 1

      - name: Re-enrich Southeastern photos now
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            RESP=$(curl -fsS --retry 2 --retry-delay 2 -X POST 'https://special-teams-analytics.vercel.app/api/sela?route=enrich-step')
            echo "batch $i: $RESP"
            DONE=$(python3 -c 'import json,sys; print(str(bool(json.load(sys.stdin).get("done"))).lower())' <<< "$RESP")
            if [ "$DONE" = 'true' ]; then break; fi
          done

      - name: Verify photo coverage
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS 'https://special-teams-analytics.vercel.app/api/sela?route=roster' > /tmp/sela-roster.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/sela-roster.json'))
          players=d if isinstance(d,list) else d.get('players',[])
          current=[p for p in players if 2026 in (p.get('rosterSeasons') or ([p.get('rosterSeason')] if p.get('rosterSeason') else []))]
          with_photo=[p for p in current if p.get('image')]
          print('current players',len(current),'current photos',len(with_photo))
          print('missing sample',[(p.get('number'),p.get('name')) for p in current if not p.get('image')][:20])
          if len(with_photo) < 50:
              raise SystemExit('Photo coverage is still unexpectedly low')
          PY
