name: Add Southeastern to prep opponent selector

on:
  push:
    paths:
      - '.github/workflows/add-southeastern-to-prep-opponent.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Southeastern Louisiana to root opponent selector
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          sela='<option value="/southeastern/">Southeastern Louisiana</option>'
          uab='<option value="/uab/" selected>UAB</option>'
          if sela not in s:
              if s.count(uab) != 1:
                  raise SystemExit(f'Expected one UAB prep option, found {s.count(uab)}')
              s=s.replace(uab, uab+'\n          '+sela, 1)
          oldnote='UAB roster + depth + PFF analytics active'
          if oldnote in s:
              s=s.replace(oldnote, 'Choose opponent workspace', 1)
          p.write_text(s)
          PY
          git diff --check
          grep -n -A7 -B2 'id="opponentWorkspaceSelect"' index.html
          grep -q '<option value="/southeastern/">Southeastern Louisiana</option>' index.html
          git config user.name 'tommydenison4-ctrl'
          git config user.email 'tommydenison4@gmail.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'Selector already contains Southeastern Louisiana.'
            exit 0
          fi
          git commit -m 'Add Southeastern to prep opponent selector'
          git push origin main
