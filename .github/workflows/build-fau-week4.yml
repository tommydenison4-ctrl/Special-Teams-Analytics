name: Build Florida Atlantic Week 4

on:
  push:
    paths:
      - '.github/workflows/build-fau-week4.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Build Week 4 Florida Atlantic workspace
        run: |
          python3 - <<'PY'
          import base64,gzip
          payload=''
          open('/tmp/build_fau.py','wb').write(gzip.decompress(base64.b64decode(payload)))
          PY
          python3 /tmp/build_fau.py
      - name: Syntax and data checks
        run: |
          node --check api/sela.js
          node --check api/player-image.js
          node --check lib/fau-storage.js
          node --check lib/fau-roster.js
          node --check lib/fau-sync.js
          node --check lib/fau-enrich.js
          python3 - <<'PY'
          import csv,json
          from pathlib import Path
          expected=[('fau/data/offensive-side.csv',25),('fau/data/defensive-side.csv',23)]
          for fn,count in expected:
              with open(fn,newline='') as f: rows=list(csv.DictReader(f))
              if len(rows)!=count or not rows or 'pff_SPECIALTEAMSTYPE' not in rows[0]:
                  raise SystemExit(f'Bad FAU PFF feed {fn}: {len(rows)} rows')
          d=json.loads(Path('fau/data/depth-chart.json').read_text())
          assert d['specialTeams']['PT'][0][1]=='Reed Chandley'
          assert d['specialTeams']['PK'][0][1]=='Collin Rogers'
          print('FAU data checks passed')
          PY
      - name: Commit Week 4
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fau southeastern/index.html api/sela.js api/player-image.js lib/fau-storage.js lib/fau-roster.js lib/fau-sync.js lib/fau-enrich.js
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Add Florida Atlantic Week 4 special teams"
          git push origin main
