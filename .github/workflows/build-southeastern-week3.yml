name: Build Week 3 Southeastern Louisiana app

on:
  push:
    paths:
      - '.github/workflows/build-southeastern-week3.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Week 3 workspace
        run: python3 scripts/build_southeastern_week3.py
      - name: Validate and publish
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          echo 'Changed files:'
          git status --short
          git config user.name 'tommydenison4-ctrl'
          git config user.email 'tommydenison4@gmail.com'
          git add southeastern api/storage-project-sela.js api/roster-sela.js api/sync-roster-sela.js api/enrich-roster-sela.js api/sync-sela-now.js uab/index.html
          git commit -m 'Add isolated Week 3 Southeastern Louisiana special teams app'
          git push origin main
