name: Fix Southeastern live parity

on:
  push:
    paths:
      - '.github/workflows/fix-sela-live-parity.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Restore PFF stats to current Southeastern depth players
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('player-intel-live-fix.js')
          text=p.read_text()
          old="""      if(!match&&p.number){
        match=pff.find(function(x){
          if(String(x&&x.num||'')!==String(p.number||''))return false;
          const xp=x&&x.p;
          return !xp||!xp.name||sameName(xp.name,p.name);
        });
      }
"""
          new="""      if(!match&&p.number){
        match=pff.find(function(x){
          if(String(x&&x.num||'')!==String(p.number||''))return false;
          // For Southeastern, the published 2026 depth chart is the identity authority.
          // Once the LASE PFF row and current depth player share a jersey number,
          // attach those PFF rows even if the older roster snapshot has a stale name.
          if(isSela())return true;
          const xp=x&&x.p;
          return !xp||!xp.name||sameName(xp.name,p.name);
        });
      }
"""
          if old not in text:
              raise SystemExit('Could not find the SELA PFF matching block')
          p.write_text(text.replace(old,new,1))

          # Force browsers to load this repaired version immediately.
          for path in ['index.html','southeastern/week3-template.html']:
              q=Path(path)
              s=q.read_text()
              s=re.sub(r'/player-intel-live-fix\.js\?v=[^"\']+', '/player-intel-live-fix.js?v=20260914-1842', s)
              q.write_text(s)
          PY
      - name: Commit repaired stat matching
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add player-intel-live-fix.js index.html southeastern/week3-template.html
          git commit -m "Restore Southeastern punter stats to current depth players"
          git push origin main
