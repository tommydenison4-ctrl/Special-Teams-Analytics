name: Fix Southeastern live parity

on:
  push:
    paths:
      - '.github/workflows/fix-sela-live-parity.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Put the SELA fix in the actual live documents
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          VERSION='20260914-1829'
          SCRIPT=f'<script src="/player-intel-live-fix.js?v={VERSION}"></script>'

          def inject_last_body(path):
              p=Path(path)
              text=p.read_text()
              # Remove older copies so the patch can only execute once.
              text=re.sub(r'\s*<script\s+src=["\']/player-intel-live-fix\.js\?v=[^"\']+["\']></script>\s*','\n',text,flags=re.I)
              idx=text.lower().rfind('</body>')
              if idx < 0:
                  raise SystemExit(f'{path}: no closing body tag')
              text=text[:idx]+'  '+SCRIPT+'\n'+text[idx:]
              p.write_text(text)

          # Critical fix: the previous wrapper used str.replace('</body>', ...), which
          # hit an earlier literal </body> inside the app's JavaScript instead of the
          # document's real closing body. Put the patch directly in the real documents.
          inject_last_body('index.html')
          inject_last_body('southeastern/week3-template.html')

          # Week 1/root loader: stop trying to inject the repair script into a fetched
          # HTML string. The root document now owns the repair script. Keep week nav,
          # but insert it at the final body close instead of the first literal </body>.
          p=Path('week1/index.html')
          text=p.read_text()
          text=re.sub(r"\n\s*const liveFix='<script src=\\?\"/player-intel-live-fix\.js\?v=[^']+';",'',text)
          text=text.replace("      html = html.replace('</body>', liveFix + weekNav + '</body>');",
                            "      const bodyClose=html.toLowerCase().lastIndexOf('</body>');\n      if(bodyClose<0)throw new Error('Week 1 app is missing its closing body tag.');\n      html=html.slice(0,bodyClose)+weekNav+html.slice(bodyClose);")
          p.write_text(text)

          # Dedicated Week 3 wrapper: remove the earlier script-string injection. The
          # template now includes the live fix itself. Also insert week navigation at
          # the actual final body close.
          p=Path('southeastern/index.html')
          text=p.read_text()
          text=re.sub(r"\n\s*html = html\.replace\('</body>', '<script src=\\?\"/player-intel-live-fix\.js\?v=[^\n]+\n",'\n',text)
          old="      html = html.replace('</body>', '<div id=\"weekJumpDockFixed\" style=\"position:fixed;right:16px;top:96px;z-index:2147483647;display:flex;gap:8px;flex-wrap:wrap;align-items:center\">' + weekButtons + '</div></body>');"
          new="      const weekDock='<div id=\"weekJumpDockFixed\" style=\"position:fixed;right:16px;top:96px;z-index:2147483647;display:flex;gap:8px;flex-wrap:wrap;align-items:center\">' + weekButtons + '</div>';\n      const bodyClose=html.toLowerCase().lastIndexOf('</body>');\n      if(bodyClose<0)throw new Error('Week 3 app is missing its closing body tag.');\n      html=html.slice(0,bodyClose)+weekDock+html.slice(bodyClose);"
          if old in text:
              text=text.replace(old,new,1)
          p.write_text(text)
          PY
      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html player-intel-live-fix.js southeastern/week3-template.html southeastern/index.html week1/index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Load Southeastern repair in the actual live HTML"
          git push origin main
