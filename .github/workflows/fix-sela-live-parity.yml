name: Fix Southeastern live parity

on:
  push:
    paths:
      - '.github/workflows/fix-sela-live-parity.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch current depth players with PFF stats
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('player-intel-live-fix.js')
          s = p.read_text()
          needle = "          const xp=x&&x.p;\n          return !xp||!xp.name||sameName(xp.name,p.name);"
          replacement = "          if(isSela())return true;\n          const xp=x&&x.p;\n          return !xp||!xp.name||sameName(xp.name,p.name);"
          if 'if(isSela())return true;' not in s:
              if needle not in s:
                  raise SystemExit('PFF jersey-number match block not found')
              s = s.replace(needle, replacement, 1)
          p.write_text(s)

          for file_name in ['index.html', 'southeastern/week3-template.html']:
              q = Path(file_name)
              t = q.read_text()
              t = t.replace('/player-intel-live-fix.js?v=20260914-1829', '/player-intel-live-fix.js?v=20260914-1848')
              q.write_text(t)
          PY
      - name: Commit repaired stat matching
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add player-intel-live-fix.js index.html southeastern/week3-template.html
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Restore Southeastern PFF stats to current depth players"
          git push origin main
