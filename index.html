async function enrichRosterBatches(){
  if(CLOUD.readOnly)return;
  const adminKey=ensureAdminKey();
  if(!adminKey)return;

  let total=rosterData.length;
  let completed=rosterData.filter(p=>p.image&&p.bio).length;
  rosterStatus=`Roster synced: ${total} players. Enriching photos and bios… ${completed}/${total}`;
  saveTeamSettings(false);render();

  let safety=0;
  while(completed<total && safety<30){
    safety++;
    const response=await fetch('/api/enrich-roster',{
      method:'POST',
      headers:{'content-type':'application/json'},
      body:JSON.stringify({adminKey,batchSize:8})
    });

    let result={};
    try{result=await response.json()}catch(e){}
    if(!response.ok)throw new Error(result.error||`Player enrichment returned ${response.status}`);

    await loadRosterFromSupabase();
    completed=result.completed ?? rosterData.filter(p=>p.image&&p.bio).length;
    total=result.total ?? rosterData.length;

    rosterStatus=`Roster synced: ${total} players. Player details: ${completed}/${total} • Photos: ${result.photos??0} • Bios: ${result.bios??0}`;
    saveTeamSettings(false);render();

    if(result.done || !result.processed)break;
  }

  const photos=rosterData.filter(p=>p.image).length;
  const bios=rosterData.filter(p=>p.bio).length;
  rosterStatus=`Roster ready: ${rosterData.length} players • ${photos} photos • ${bios} bios.`;
  saveTeamSettings(false);render();
}

async function refreshRosterFromUrl(){
  const next={
    ...teamSettings,
    teamName:($('teamNameSetting')?.value||'').trim(),
    nickname:($('nicknameSetting')?.value||'').trim(),
    teamCode:($('teamCodeSetting')?.value||'').trim().toUpperCase(),
    rosterUrl:($('rosterUrlSetting')?.value||'').trim()
  };
  if(!next.rosterUrl){
    rosterStatus='Enter the official roster URL first.';
    saveTeamSettings(false);render();return;
  }

  const adminKey=ensureAdminKey();
  if(!adminKey)return;

  teamSettings=next;
  saveTeamSettings(false);
  rosterStatus='Syncing base roster from the official team website…';
  render();

  try{
    const response=await fetch('/api/sync-roster',{
      method:'POST',
      headers:{'content-type':'application/json'},
      body:JSON.stringify({
        url:teamSettings.rosterUrl,
        teamName:teamSettings.teamName,
        nickname:teamSettings.nickname,
        teamCode:teamSettings.teamCode,
        adminKey
      })
    });

    let result={};
    try{result=await response.json()}catch(e){}
    if(!response.ok)throw new Error(result.error||`Roster sync returned ${response.status}`);

    await loadRosterFromSupabase();
    rosterStatus=`Base roster synced: ${rosterData.length} players. Starting photo/bio enrichment…`;
    saveTeamSettings(false);
    setup();render();

    await enrichRosterBatches();
  }catch(err){
    rosterStatus='Roster sync failed: '+err.message;
    saveTeamSettings(false);
    render();
    alert(rosterStatus);
  }
}

function cloudPayload(){

function applyAccessMode(){

function ensureAdminKey(){
  if(!ACCESS.adminRequested)return '';
  if(ACCESS.adminKey)return ACCESS.adminKey;
  const key=prompt('Enter your Special Teams admin key:')||'';
  if(key){
    ACCESS.adminKey=key.trim();
    sessionStorage.setItem('stAdminKey',ACCESS.adminKey);
  }

async function saveProjectCloud(options={}){
  if(CLOUD.readOnly){
    if(!options.silent)alert('This is the read-only staff view.');
    return false;
  }

  const adminKey=ensureAdminKey();
  if(!adminKey){
    if(!options.silent)alert('Admin key is required.');
    return false;
  }

  const btn=$('saveCloudBtn');
  if(btn&&!options.silent){btn.disabled=true;btn.textContent='Saving…'}

  try{
    const r=await fetch('/api/storage-project',{
      method:'POST',
      headers:{'content-type':'application/json'},
      body:JSON.stringify({
        action:'save',
        adminKey,
        data:cloudPayload()
      })
    });

    const j=await r.json();
    if(!r.ok)throw new Error(j.error||'Project save failed');

    CLOUD.status='Saved '+new Date().toLocaleTimeString();
    if(!options.silent)alert('Saved to Supabase Storage. Coaches will get the updated looks/settings on reload.');
    return true;
  }catch(e){
    console.error('Project save failed:',e);
    if(!options.silent)alert('Save failed: '+e.message);
    return false;
  }finally{
    if(btn&&!options.silent){btn.disabled=false;btn.textContent='Save Looks / Settings'}
  }
}

function queueAutoSave(reason='Update'){
  if(CLOUD.readOnly)return;
  clearTimeout(CLOUD.saveTimer);
  CLOUD.status=reason+' • waiting to save';
  CLOUD.saveTimer=setTimeout(()=>saveProjectCloud({silent:true}),700);
}

async function loadProjectCloud(options={}){
  if(CLOUD.loading)return false;
  CLOUD.loading=true;

  try{
    const r=await fetch('/api/storage-project?action=load&v='+Date.now(),{cache:'no-store'});
    if(r.status===404){
      CLOUD.status='No project.json found yet';
      return false;
    }

    const j=await r.json();
    if(!r.ok)throw new Error(j.error||'Project load failed');

    const d=j.data||{};
    if(d.teamSettings)teamSettings={...DEFAULT_TEAM_SETTINGS,...d.teamSettings};
    if(Array.isArray(d.savedLooks))savedLooks=d.savedLooks;
    if(d.repAssignments&&typeof d.repAssignments==='object')repAssignments=d.repAssignments;

    saveTeamSettings(false);
    saveRoster(false);
    persistLooks(false);

    CLOUD.status='Supabase project.json loaded';
    if(options.notice)alert('Latest looks and settings loaded.');
    return true;
  }catch(e){
    console.error('Project load failed:',e);
    if(options.notice)alert('Could not load project.json: '+e.message);
    return false;
  }finally{
    CLOUD.loading=false;
  }
}

async function loadRosterFromSupabase(options={}){
  try{
    const response=await fetch(pffStorageUrl(PFF_STORAGE.roster),{cache:'no-store'});
    if(response.status===404){
      rosterStatus='No roster.json found in Supabase Storage.';
      if(options.notice)alert('No roster.json is in Special Teams / Current yet.');
      return false;
    }
    if(!response.ok)throw new Error(`roster.json returned ${response.status}`);
    const data=await response.json();
    const parsed=Array.isArray(data)?data:(Array.isArray(data.players)?data.players:[]);
    if(!parsed.length)throw new Error('roster.json contains no players');
    rosterData=parsed;
    saveRoster();
    rosterStatus=`Supabase roster loaded: ${parsed.length} players.`;
    saveTeamSettings();
    return true;
  }catch(err){
    console.error('Supabase roster load failed:',err);
    rosterStatus='Roster could not load from Supabase: '+err.message;
    if(options.notice)alert(rosterStatus);
    return false;
  }
}

async function loadPffFromSupabase(options={}){
  setDataSourceStatus('Loading offense-side.csv + defense-side.csv from Supabase…');
  try{
    const results=await Promise.all(PFF_STORAGE.files.map(async name=>{
      const response=await fetch(pffStorageUrl(name),{cache:'no-store'});
      if(!response.ok)throw new Error(`${name} returned ${response.status}`);
      const body=await response.text();
      const parsed=parseCSV(body);
      if(!parsed.length)throw new Error(`${name} contained no play rows`);
      return {name,rows:parsed};
    }));
    const rawCount=results.reduce((n,x)=>n+x.rows.length,0);
    rows=mergePffSources(results.map(x=>x.rows));
    const counts=classifyCounts(rows);
    const countText=Object.entries(counts).map(([k,n])=>`${k}: ${n}`).join(' • ');
    setDataSourceStatus(`Supabase live • 2 files • ${rawCount} raw rows • ${rows.length} unique plays${countText?' • '+countText:''}`);
    setup();
    playIndex=0;chartIndex=0;chartPositions={};
    if(options.render!==false)render();
    return true;
  }catch(err){
    console.error('Supabase PFF load failed:',err);
    rows=[];
    setup();
    setDataSourceStatus('PFF data could not load from Supabase: '+err.message,true);
    if(options.notice)alert('Could not load PFF data from Supabase: '+err.message);
    if(options.render!==false)render();
    return false;
  }
}

function truthyResult(r,needle){return String(v(r,'pff_KICKRESULT')).toUpperCase().includes(needle)}
function safeMax(vals){vals=vals.filter(x=>x!=null&&Number.isFinite(x));return vals.length?Math.max(...vals):null}
function safeMin(vals){vals=vals.filter(x=>x!=null&&Number.isFinite(x));return vals.length?Math.min(...vals):null}
function hashLabel(h){return h==='L'?'Left':h==='C'?'Middle':'Right'}
function byHashRows(rs){return ['L','C','R'].map(h=>[h,rs.filter(r=>String(v(r,'pff_HASH')).toUpperCase()===h)])}
function metricCell(x,d=1,suffix=''){return x==null||Number.isNaN(x)?'—':fmt(x,d)+(suffix||'')}
function htmlTable(headers,rows){return `<table class="splitTable"><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((c,i)=>`<${i===0?'th':'td'}>${c}</${i===0?'th':'td'}>`).join('')}</tr>`).join('')}</tbody></table>`}

function render(){
  const a=filtered();
  const app=$('app');
  if(!app)return;
  app.innerHTML=
    page==='dashboard'?dashboard(a):
    page==='hash'?hashIntelligencePage(a):
    page==='spray'?spray(a):
    page==='viewer'?viewer(a):
    page==='chart'?chartPage(a):
    page==='library'?libraryPage(a):
    page==='players'?playerPage(a):
    page==='relationships'?relationshipPage(a):
    page==='families'?families(a):
    page==='settings'?teamSettingsPage():
    title('Play Log','All filtered special-teams plays')+table(a);
  bind();
}
