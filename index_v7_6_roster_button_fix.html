<body>

<script>


const DEFAULT_TEAM_SETTINGS={teamName:'',nickname:'',teamCode:'',rosterUrl:'',season:'2025'};
let teamSettings=(()=>{try{return {...DEFAULT_TEAM_SETTINGS,...JSON.parse(localStorage.getItem('stTeamSettingsV65')||'{}')}}catch(e){return {...DEFAULT_TEAM_SETTINGS}}})();
let rosterStatus=localStorage.getItem('stRosterStatusV65')||'No roster is connected. Enter the team and official roster URL, then connect it. Local-file browsers may block website imports.';
function saveTeamSettings(){localStorage.setItem('stTeamSettingsV65',JSON.stringify(teamSettings));localStorage.setItem('stRosterStatusV65',rosterStatus)}
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function sidearmRosterFromHTML(html,baseUrl){
  const doc=new DOMParser().parseFromString(html,'text/html');
  const cards=[...doc.querySelectorAll('.sidearm-roster-player')];
  const out=[];
  cards.forEach(card=>{
    const text=(sel)=>card.querySelector(sel)?.textContent?.trim()||'';
    const name=text('.sidearm-roster-player-name, .sidearm-roster-player-name h3, h3');
    if(!name)return;
    const number=text('.sidearm-roster-player-jersey-number, .sidearm-roster-player-jersey');
    const position=text('.sidearm-roster-player-position, .text-bold');
    const height=text('.sidearm-roster-player-height');
    const weight=text('.sidearm-roster-player-weight').replace(/\s*lbs?\.?$/i,'');
    const cls=text('.sidearm-roster-player-academic-year, .sidearm-roster-player-year');
    const hometown=text('.sidearm-roster-player-hometown');
    const previousSchool=text('.sidearm-roster-player-previous-school');
    const a=card.querySelector('a[href*="/roster/"]');
    const img=card.querySelector('img');
    let profile=a?.href||''; let image=img?.currentSrc||img?.src||img?.getAttribute('data-src')||'';
    try{profile=profile?new URL(profile,baseUrl).href:''}catch(e){}
    try{image=image?new URL(image,baseUrl).href:''}catch(e){}
    out.push({number,name,position,height,weight,class:cls,hometown,previousSchool,image,profile,bio:''});
  });
  return out;
}
async function refreshRosterFromUrl(){
  const next={
    ...teamSettings,
    teamName:($('teamNameSetting')?.value||'').trim(),
    nickname:($('nicknameSetting')?.value||'').trim(),
    teamCode:($('teamCodeSetting')?.value||'').trim().toUpperCase(),
    rosterUrl:($('rosterUrlSetting')?.value||'').trim()
  };
  if(!next.rosterUrl){
    rosterStatus='Enter an official roster URL before connecting.';
    saveTeamSettings();render();return;
  }
  const changed=[teamSettings.teamName,teamSettings.nickname,teamSettings.teamCode,teamSettings.rosterUrl].join('|')!==[next.teamName,next.nickname,next.teamCode,next.rosterUrl].join('|');
  teamSettings=next;
  if(changed){rosterData=[];selectedSpecialist='';saveRoster();}
  saveTeamSettings();
  rosterStatus='Connecting to the official roster page…';saveTeamSettings();render();
  try{
    const controller=new AbortController();
    const timer=setTimeout(()=>controller.abort(),22000);
    let res;
    try{
      res=await fetch('/api/import-roster',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({url:teamSettings.rosterUrl}),
        signal:controller.signal
      });
    }finally{clearTimeout(timer)}
    let payload={};
    try{payload=await res.json()}catch(e){}
    if(!res.ok)throw new Error(payload.error||('Roster service returned '+res.status));
    const parsed=Array.isArray(payload.players)?payload.players:[];
    if(!parsed.length)throw new Error('The roster page was reached, but no player cards were found.');
    rosterData=parsed;saveRoster();
    rosterStatus='Roster connected: '+parsed.length+' players loaded from '+(payload.source||teamSettings.rosterUrl)+'.';
    saveTeamSettings();setup();
    if($('teamF')&&[...$('teamF').options].some(o=>o.value===teamSettings.teamCode))$('teamF').value=teamSettings.teamCode;
    render();
  }catch(err){
    rosterStatus='Roster connection failed. No previous team was substituted. '+(err.name==='AbortError'?'The request timed out after 22 seconds.':err.message);
    saveTeamSettings();render();
  }
}

function normNum(x){return String(x||'').replace(/[^0-9]/g,'').replace(/^0+(?=\d)/,'')}
function codeNumber(x){let m=String(x||'').match(/(?:^|\s)[SD]?(\d{1,2})(?:\s|$)/);return m?normNum(m[1]):''}
function rosterByNumber(num){num=normNum(num);return rosterData.find(p=>normNum(p.number)===num)||null}
function normCode(x){return String(x||'').trim().toUpperCase()}
function specialistIdentity(r){let raw=String(v(r,'pff_KICKER')||'').trim(),m=raw.match(/^([A-Z0-9]+)\s+[SD]?(\d{1,2})\b/i);return m?{team:normCode(m[1]),num:normNum(m[2]),raw}:null}
function rosterPosition(p){return normCode(p?.position).replace(/\s+/g,'')}
function eligibleSpecialist(p,kind){if(!p)return false;let pos=rosterPosition(p);if(kind==='kicker')return ['K','PK','K/P','P/K','SP'].includes(pos);if(kind==='punter')return ['P','PT','K/P','P/K','SP'].includes(pos);return true}
function specialistRowsForTeam(a,kind){let team=normCode(selectedTeam()),unit=kind==='punter'?'PUNT':kind==='kicker'?'FIELD GOAL':'KICKOFF';if(!team)return [];return teamUnitRows(a,unit).filter(r=>{let id=specialistIdentity(r);return id&&id.team===team})}
function initials(name){return String(name||'?').split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase()}
function playerPhoto(p){let img=p&&p.image?`<img src="${p.image}" alt="${p.name}" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">`:'';return `${img}<div class="playerInitials" style="${img?'display:none':''}">${initials(p?.name)}</div>`}
function playerCard(p,stats,label){p=p||{name:label||'Unmatched player',number:'',position:'',height:'',weight:'',class:'',hometown:'',previousSchool:'',bio:'Add this player through the roster upload.'};let meta=[p.position,[p.height,p.weight&&p.weight+' lbs'].filter(Boolean).join(' · '),p.class,p.hometown].filter(Boolean).join(' • ');let st=stats||[];return `<div class="playerCard"><div class="playerPhoto">${playerPhoto(p)}<div class="playerNo">#${p.number||'—'}</div></div><div class="playerBody"><h3>${p.name||label}${p.profile?'<span class="rosterBadge">OFFICIAL BIO</span>':''}</h3><div class="playerMeta">${meta||'Roster match pending'}${p.previousSchool?'<br>Previous: '+p.previousSchool:''}</div><div class="playerStatRow">${st.slice(0,3).map(x=>`<div class="playerStat"><b>${x[1]}</b><span>${x[0]}</span></div>`).join('')}</div><div class="bioSnippet">${p.bio||''}</div>${p.profile?`<a class="profileLink" href="${p.profile}" target="_blank" rel="noopener">Open full official bio ↗</a>`:''}</div></div>`}
function playerCodeRows(a,unit,role){let team=selectedTeam();if(!team)return [];return a.filter(r=>v(r,'pff_SPECIALTEAMSTYPE')===unit&&(v(r,'pff_OFFTEAM')===team||v(r,'pff_DEFTEAM')===team)).map(r=>{let fields=[v(r,'pff_KICKER'),v(r,'pff_RETURNER'),v(r,'pff_OFFPLAYERS'),v(r,'pff_DEFPLAYERS')].join(';');let matches=[...fields.matchAll(new RegExp(team+'\\s+([SD]?\\d+)\\s*\\(([^)]+)\\)','g'))];return {r,codes:matches.filter(m=>!role||m[2].includes(role)).map(m=>m[1])}})}
function specialistStats(a,kind){let rows=specialistRowsForTeam(a,kind),by={};rows.forEach(r=>{let id=specialistIdentity(r);if(!id)return;(by[id.num]||(by[id.num]=[])).push(r)});return Object.entries(by).map(([num,rs])=>{let p=rosterByNumber(num);if(!eligibleSpecialist(p,kind))return null;let made=rs.filter(r=>String(v(r,'pff_KICKRESULT')).toUpperCase().includes('MADE')).length,tb=rs.filter(r=>String(v(r,'pff_KICKRESULT')).toUpperCase().includes('TOUCH')).length;return {num,rows:rs,p,stats:kind==='punter'?[['Punts',rs.length],['Gross',fmt(avg(rs.map(r=>v(r,'pff_KICKYARDS'))),1)],['Op time',fmt(avg(rs.map(r=>v(r,'pff_OPERATIONTIME'))),2)]]:kind==='kicker'?[['FG',made+'/'+rs.length],['FG%',pct(made,rs.length)],['Long',fmt(Math.max(0,...rs.filter(r=>String(v(r,'pff_KICKRESULT')).toUpperCase().includes('MADE')).map(r=>n(v(r,'pff_KICKYARDS'))||0)),0)]]:[['KO',rs.length],['TB%',pct(tb,rs.length)],['Depth',fmt(avg(rs.map(r=>v(r,'pff_KICKDEPTH'))),1)]]}}).filter(Boolean).sort((x,y)=>y.rows.length-x.rows.length)}
function returnerDashboardStats(a,unit){let team=selectedTeam();let rs=a.filter(r=>v(r,'pff_SPECIALTEAMSTYPE')===unit&&v(r,returnTeamField(unit))===team);let by={};rs.forEach(r=>{let names=returnerNames(r);if(!names.length){let list=String(v(r,'pff_OFFPLAYERS')||v(r,'pff_DEFPLAYERS')||'');let m=[...list.matchAll(new RegExp(team+'\\s+([SD]?\\d+)\\s*\\((?:KR[^)]*|PR)\\)','g'))];names=m.map(x=>team+' '+x[1])}names.forEach(name=>{let num=codeNumber(name);if(!num)return;(by[num]||(by[num]=[])).push(r)})});return Object.entries(by).map(([num,rows])=>{let y=rows.map(r=>n(v(r,'pff_RETURNYARDS'))).filter(x=>x!=null);return {num,rows,stats:[['Returns',y.length],['Average',fmt(avg(y),1)],['Long',y.length?Math.max(...y):'—']]}}).sort((x,y)=>(avg(y.rows.map(r=>n(v(r,'pff_RETURNYARDS'))))||0)-(avg(x.rows.map(r=>n(v(r,'pff_RETURNYARDS'))))||0))}

async function saveProjectCloud(){
  const btn=$('saveCloudBtn'); if(btn){btn.disabled=true;btn.textContent='Saving…'}
  try{
    const r=await fetch('/api/project',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({projectId:CLOUD.projectId||null,editKey:CLOUD.editKey||null,data:cloudPayload()})});

    CLOUD.projectId=j.projectId; CLOUD.editKey=j.editKey||CLOUD.editKey;
    if(CLOUD.editKey)localStorage.setItem('stEditKey:'+CLOUD.projectId,CLOUD.editKey);
    const u=new URL(location.href);u.searchParams.set('project',CLOUD.projectId);history.replaceState({},'',u);
    CLOUD.status='Saved '+new Date().toLocaleTimeString();
    alert('Project saved. The share link now opens this team and its loaded data.');
  }catch(e){alert('Save failed: '+e.message)}finally{if(btn){btn.disabled=false;btn.textContent='Save Project'}}
}
async function loadProjectCloud(){
  if(!CLOUD.projectId)return false;
  try{
    const r=await fetch('/api/project',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'load',projectId:CLOUD.projectId})});const j=await r.json();if(!r.ok)throw new Error(j.error||'Project load failed');
    const d=j.data||{};
    if(d.teamSettings)teamSettings={...DEFAULT_TEAM_SETTINGS,...d.teamSettings};
    if(Array.isArray(d.rosterData))rosterData=d.rosterData;
    if(Array.isArray(d.rows))rows=d.rows;
    if(Array.isArray(d.savedLooks))savedLooks=d.savedLooks;
    if(d.repAssignments&&typeof d.repAssignments==='object')repAssignments=d.repAssignments;
    saveTeamSettings();saveRoster();persistLooks();CLOUD.status='Shared project loaded';return true;
  }catch(e){alert('Could not load shared project: '+e.message);return false}
}
function copyShareLink(){
  if(!CLOUD.projectId){alert('Save the project first.');return}

  navigator.clipboard?.writeText(u.toString()).then(()=>alert('Share link copied.')).catch(()=>prompt('Copy this share link:',u.toString()));
}

function rolePos(role,i,type,side,play){
 let r=String(role).toUpperCase(),x=50,y=50;
 if(type==='PUNT'&&side==='unit'){
  if(r==='P'){x=50;y=88}else if(r==='PLS'){x=50;y=48}
  else if(r==='GL'){x=7;y=46}else if(r==='GR'){x=93;y=46}
  else if(r==='PLT'){x=34;y=48}else if(r==='PLG'){x=43;y=48}else if(r==='PRG'){x=57;y=48}else if(r==='PRT'){x=66;y=48}
  else if(r==='PPL'){x=32;y=63}else if(r==='PPR'){x=68;y=63}else if(r==='PPRI'){x=60;y=63}else if(r==='PPRO'){x=76;y=63}
  else if(r==='PLW'){x=22;y=58}else if(r==='PRW'){x=78;y=58}else{x=12+(i%10)*8.4;y=60}
 }else if(type==='PUNT'){
  if(r==='PR'){x=50;y=89}else if(r==='VL'){x=7;y=47}else if(r==='VR'){x=93;y=47}else if(r==='PLL'){x=16;y=45}else if(r==='PLR'){x=84;y=45}
  else if(/^PDL\d$/.test(r)){let q=+r.slice(-1);x=42-(q-1)*7;y=45+(q%2)*4}
  else if(/^PDR\d$/.test(r)){let q=+r.slice(-1);x=58+(q-1)*7;y=45+(q%2)*4}
  else{x=12+(i%9)*9.5;y=47}
 }else if(type==='KICKOFF'&&side==='unit'){
  if(r==='PK'){x=50;y=72}
  else if(/^L[1-5]$/.test(r)){let q=+r.slice(1);x=45-(q-1)*9;y=48+(q%2)*3}
  else if(/^R[1-5]$/.test(r)){let q=+r.slice(1);x=55+(q-1)*9;y=48+(q%2)*3}
  else{x=10+i*8;y=50}
 }else{
  let tagged=String(v(play,'pff_RETURNER')||'').toUpperCase();
  let playerName=String(play?._layoutPlayerName||'').toUpperCase();
  let isTagged=tagged && playerName && (tagged===playerName || tagged.includes(playerName) || playerName.includes(tagged));
  if(r==='KR-L'){x=37;y=isTagged?92:84}
  else if(r==='KR-R'){x=63;y=isTagged?92:84}
  else if(r==='KR'){x=50;y=92}
  else if(r==='KFB-L'){x=39;y=76}else if(r==='KFB-R'){x=61;y=76}else if(r==='KFB'){x=50;y=76}
  else if(r==='LB'){x=25;y=63}else if(r==='MB'||r==='MM'||r==='MF'){x=50;y=63}else if(r==='RB'){x=75;y=63}
  else if(r==='LM'){x=38;y=63}else if(r==='RM'){x=62;y=63}
  else if(/^LF[1-3]$/.test(r)){let q=+r.slice(-1);x=18+(q-1)*16;y=50}
  else if(/^RF[1-3]$/.test(r)){let q=+r.slice(-1);x=82-(q-1)*16;y=50}
  else{x=10+i*8;y=50}
 }
 return{x,y}
}

function chartPage(a){let plays=chartPlays(a);if(!plays.length)return title('Chart Looks','Drag players to record actual pre-snap spacing')+unitTabs()+`<div class="empty">No ${viewType} plays are available for this unit and filter.</div>`;let r=activeChartPlay(a);initChartPositions(r);let dots=Object.entries(chartPositions).map(([k,p])=>chartDot(p,k)).join('');let coords=Object.values(chartPositions).sort((a,b)=>a.role.localeCompare(b.role)).map(p=>`<div class="coordLine"><b>${p.role}</b><span>${p.name}</span><span>${p.x.toFixed(1)}</span><span>${p.y.toFixed(1)}</span></div>`).join('');let assigned=repAssignments[playKey(r)],label=viewType==='PUNT'?(viewSide==='unit'?'Punt Team':'Punt Return'):(viewSide==='unit'?'Kickoff Coverage':'Kickoff Return');return title(`${label} Look Charting`,'Drag each player to the actual alignment. Save it once, then connect or match every underlying rep.')+unitTabs()+`<div class="playControls"><button id="chartPrev">Previous rep</button><button id="chartNext">Next rep</button><button id="copyPrev">Copy previous chart</button><button id="resetChart">Reset positions</button><span class="viz-badge">Rep ${chartIndex+1} of ${plays.length}</span></div><div class="chartShell"><div class="chartField" id="chartField"><div class="los"></div><div class="losLabel">REFERENCE LINE</div>${depthOverlay(viewType,viewSide)}${dots}</div><div class="chartPanel"><div class="playCard">${sourceSummary(r)}${assigned?`<div class="note">Assigned to ${savedLooks.find(x=>x.id===assigned.lookId)?.name||'saved look'}</div>`:''}</div>${matchMarkup()}<div class="playCard"><div class="eyebrow">Save / assign</div><input class="input" id="lookName" placeholder="Look name, e.g. Punt Return 2x Vice"><div class="fieldActions" style="margin-top:8px"><button class="primary wide" id="saveNewLook">Save as new look</button><button class="success wide" id="assignBest">Assign to best match</button><button id="mirrorChart">Mirror alignment</button><button id="exportLooks">Export l function libraryPage(a){let ls=savedLooks.filter(l=>(!$('unitF').value||l.unit===$('unitF').value));if(!ls.length)return title('Look Library','Saved alignments and all underlying rep data')+`<div class="empty">No looks have been saved yet. Open Chart Looks, drag the players, and save the first alignment.</div>`;return title('Look Library','Every saved diagram keeps its assigned PFF reps and underlying performance data')+`<div class="libraryGrid">${ls.map(l=>{let rr=assignedRows(l,rows),returns=rr.filter(r=>n(v(r,'pff_RETURNYARDS'))!=null);return `<div class="family"><div class="lookHead"><div><div class="lookName">${l.name}</div><div class="lookMeta">${l.unit} • ${l.side==='unit'?'unit':'return'} • ${l.positions.length} players</div></div><div><b>${l.repKeys.length}</b><div class="lookMeta">reps</div></div></div>${lookField(l)}<div class="metrics"><div class="mini"><b>${l.repKeys.length}</b><span>Assigned reps</span></div><div class="mini"><b>${fmt(avg(rr.map(r=>v(r,'pff_HANGTIME'))),2)}</b><span>Hang</span></div><div class="mini"><b>${fmt(avg(returns.map(r=>v(r,'pff_RETURNYARDS'))),1)}</b><span>Return yds</span></div><div class="mini"><b>${fmt(avg(rr.map(r=>v(r,'pff_EXPECTED_POINTS_ADDED'))),3)}</b><span>EPA</span></div></div><div class="lookControls"><button class="showReps" data-id="${l.id}">Show underlying reps</button><button class="loadLook" data-id="${l.id}">Open in charting</button><button class="danger deleteLook" data-id="${l.id}">Delete</button></div><div class="repRows" id="reps_${l.id}">${rr.length?rr.map(r=>`<div class="repRow"><span>Wk ${v(r,'pff_WEEK')}</span><span>${v(r,'pff_OFFTEAM')} vs ${v(r,'pff_DEFTEAM')} • ${v(r,'pff_KICKRESULT')}</span><span>${v(r,'pff_RETURNYARDS')||'—'} yds</span><span>${v(r,'pff_HANGTIME')||'—'} hang</span></div>`).join(''):'<div class="lookMeta">No currently loaded PFF rows match the saved rep IDs.</div>'}</div></div>`}).join('')}</div>`}
function saveNewLook(r){let name=($('lookName').value||`${viewType} ${viewSide==='unit'?'Unit':'Return'} Look ${savedLooks.filter(x=>x.unit===viewType&&x.side===viewSide).length+1}`).trim(),id='L'+Date.now();let look={id,name,unit:viewType,side:viewSide,positions:normalizedPositions(chartPositions),repKeys:[playKey(r)],createdAt:new Date().toISOString()};savedLooks.push(look);repAssignments[playKey(r)]={lookId:id,match:'seed'};persistLooks();$('chartStatus').textContent=`Saved ${name} and connected this rep.`;render()}

function bindChartDrag(){let field=$('chartField');if(!field)return;let drag=null;field.querySelectorAll('.dragPlayer').forEach(el=>{el.addEventListener('pointerdown',e=>{drag=el;el.setPointerCapture(e.pointerId);selectedPlayer=decodeURIComponent(el.dataset.key);el.classList.add('selected');e.preventDefault()});el.addEventListener('pointermove',e=>{if(drag!==el)return;let b=field.getBoundingClientRect(),x=Math.max(2,Math.min(98,100*(e.clientX-b.left)/b.width)),y=Math.max(2,Math.min(98,100*(e.clientY-b.top)/b.height));let snap=e.shiftKey?1:0.5;x=Math.round(x/snap)*snap;y=Math.round(y/snap)*snap;chartPositions[selectedPlayer].x=x;chartPositions[selectedPlayer].y=y;el.style.left=x+'%';el.style.top=y+'%'});el.addEventListener('pointerup',()=>{drag=null;el.classList.remove('selected');render()})})}

function scatterSVG(rows,xKey,yKey,xLab,yLab){let pts=rows.map(r=>({x:n(v(r,xKey)),y:yKey==='resultFP'?resultFP(r):n(v(r,yKey)),r})).filter(p=>p.x!=null&&p.y!=null),W=620,H=330,L=48,R=18,T=18,B=42;if(!pts.length)return `<div class="empty">No qualifying plays for this chart.</div>`;let xs=pts.map(p=>p.x),ys=pts.map(p=>p.y),xmin=Math.min(...xs),xmax=Math.max(...xs),ymin=Math.min(...ys),ymax=Math.max(...ys);if(xmin===xmax){xmin-=1;xmax+=1}if(ymin===ymax){ymin-=1;ymax+=1}let sx=x=>L+(x-xmin)/(xmax-xmin)*(W-L-R),sy=y=>H-B-(y-ymin)/(ymax-ymin)*(H-T-B);let mx=avg(xs),my=avg(ys),num=pts.reduce((s,p)=>s+(p.x-mx)*(p.y-my),0),den=pts.reduce((s,p)=>s+(p.x-mx)**2,0),slope=den?num/den:0,inter=my-slope*mx;let circles=pts.map((p,i)=>`<circle class="scatterDot" data-i="${i}" cx="${sx(p.x).toFixed(1)}" cy="${sy(p.y).toFixed(1)}" r="5" fill="#7b1d3b" stroke="#e2b34c" stroke-width="2"><title>${returnerNames(p.r).join(', ')} | ${p.x} ${xLab} | ${p.y} ${yLab} | Wk ${v(p.r,'pff_WEEK')} | ${v(p.r,'pff_KICKRESULT')}</title></circle>`).join('');return `<svg class="scatter" viewBox="0 0 ${W} ${H}"><line x1="${L}" y1="${H-B}" x2="${W-R}" y2="${H-B}" stroke="#667"/><line x1="${L}" y1="${T}" x2="${L}" y2="${H-B}" stroke="#667"/><line x1="${sx(xmin)}" y1="${sy(inter+slope*xmin)}" x2="${sx(xmax)}" y2="${sy(inter+slope*xmax)}" stroke="#2f68df" stroke-width="2" stroke-dasharray="6 4"/><text x="${W/2}" y="${H-8}" text-anchor="middle" fill="#333" font-size="12">${xLab}</text><text x="14" y="${H/2}" text-anchor="middle" fill="#333" font-size="12" transform="rotate(-90 14 ${H/2})">${yLab}</text><text x="${L}" y="${H-B+17}" fill="#555" font-size="10">${fmt(xmin,1)}</text><text x="${W-R-25}" y="${H-B+17}" fill="#555" font-size="10">${fmt(xmax,1)}</text><text x="${L-36}" y="${H-B}" fill="#555" font-size="10">${fmt(ymin,1)}</text><text x="${L-36}" y="${T+5}" fill="#555" font-size="10">${fmt(ymax,1)}</text>${circles}</svg>`}

function specialistFullStats(a,kind){let rs=specialistRowsForTeam(a,kind),by={};rs.forEach(r=>{let id=specialistIdentity(r);if(!id)return;(by[id.num]||(by[id.num]=[])).push(r)});return Object.entries(by).map(([num,rows])=>({num,rows,p:rosterByNumber(num)})).filter(x=>eligibleSpecialist(x.p,kind)).sort((x,y)=>y.rows.length-x.rows.length)}

function selectedProfile(a,cat,list){if(!list.length)return '<div class="empty">No qualifying player records match the active filters.</div>';if(!selectedSpecialist||!list.some(x=>x.num===selectedSpecialist))selectedSpecialist=list[0].num;let x=list.find(z=>z.num===selectedSpecialist)||list[0],p=x.p||rosterByNumber(x.num)||{name:(selectedTeam()||'TEAM')+' '+x.num,number:x.num,bio:'Roster profile not yet matched. Load the roster CSV or JSON to add the player image and biography.'},rs=x.rows||[];let isRet=cat==='kickReturners'||cat==='puntReturners';let metrics='';let splits='';if(isRet){let y=rs.map(r=>n(v(r,'pff_RETURNYARDS'))).filter(z=>z!=null);metrics=[['Returns',y.length],['Total yards',y.reduce((s,z)=>s+z,0)],['Average',fmt(avg(y),1)],['Median',fmt(med(y),1)],['Long',y.length?Math.max(...y):'—'],['20+ rate',pct(y.filter(z=>z>=20).length,y.length)],['0-or-less',pct(y.filter(z=>z<=0).length,y.length)],['Avg result FP',fmt(avg(rs.map(resultFP)),1)]].map(z=>`<div class="mini"><b>${z[1]}</b><span>${z[0]}</span></div>`).join('');splits=splitTableMarkup(rowHashSplits(rs),['Hash','Plays','Avg return','Avg kick','Avg hang'])}else if(cat==='kickers'){let made=rs.filter(r=>String(v(r,'pff_KICKRESULT')).toUpperCase().includes('MADE')),miss=rs.length-made.length,dist=rs.map(r=>n(v(r,'pff_KICKYARDS'))).filter(z=>z!=null);metrics=[['Attempts',rs.length],['Made',made.length],['FG%',pct(made.length,rs.length)],['Missed',miss],['Long',made.length?Math.max(...made.map(r=>n(v(r,'pff_KICKYARDS'))||0)):'—'],['Avg attempt',fmt(avg(dist),1)],['Avg operation',fmt(avg(rs.map(r=>v(r,'pff_FGOPTIME'))),2)],['Median operation',fmt(med(rs.map(r=>v(r,'pff_FGOPTIME'))),2)]].map(z=>`<div class="mini"><b>${z[1]}</b><span>${z[0]}</span></div>`).join('');splits=splitTableMarkup(['L','C','R'].map(h=>{let q=rs.filter(r=>String(v(r,'pff_HASH')).toUpperCase()===h),m=q.filter(r=>String(v(r,'pff_KICKRESULT')).toUpperCase().includes('MADE'));return [h,q.length,m.length,pct(m.length,q.length),fmt(avg(q.map(r=>v(r,'pff_KICKYARDS'))),1)]}),['Hash','Attempts','Made','FG%','Avg distance'])}else{let ret=rs.filter(r=>String(v(r,'pff_KICKRESULT')).toUpperCase().includes('RETURN')),fc=rs.filter(r=>String(v(r,'pff_KICKRESULT')).toUpperCase().includes('FAIR')),tb=rs.filter(r=>String(v(r,'pff_KICKRESULT')).toUpperCase().includes('TOUCH'));let net=rs.map(r=>{let g=n(v(r,'pff_KICKYARDS')),ry=n(v(r,'pff_RETURNYARDS'))||0;return g==null?null:g-ry});metrics=[['Punts',rs.length],['Gross',fmt(avg(rs.map(r=>v(r,'pff_KICKYARDS'))),1)],['Net',fmt(avg(net),1)],['Hang',fmt(avg(rs.map(r=>v(r,'pff_HANGTIME'))),2)],['Operation',fmt(avg(rs.map(r=>v(r,'pff_OPERATIONTIME'))),2)],['Fair catch %',pct(fc.length,rs.length)],['Touchback %',pct(tb.length,rs.length)],['Return avg',fmt(avg(ret.map(r=>v(r,'pff_RETURNYARDS'))),1)]].map(z=>`<div class="mini"><b>${z[1]}</b><span>${z[0]}</span></div>`).join('');splits=splitTableMarkup(['L','C','R'].map(h=>{let q=rs.filter(r=>String(v(r,'pff_HASH')).toUpperCase()===h);return [h,q.length,fmt(avg(q.map(r=>v(r,'pff_KICKYARDS'))),1),fmt(avg(q.map(r=>v(r,'pff_HANGTIME'))),2),fmt(avg(q.map(r=>v(r,'pff_OPERATIONTIME'))),2)]}),['Hash','Punts','Gross','Hang','Operation'])}
let meta=[p.position,[p.height,p.weight&&p.weight+' lbs'].filter(Boolean).join(' · '),p.class,p.hometown].filter(Boolean).join(' • ');return `<div class="pageBreak">${reportBanner(p.name+' Player Report')}<div class="card playerHero"><div class="playerPhoto">${playerPhoto(p)}<div class="playerNo">#${p.number||x.num}</div></div><div class="playerBioCard"><div class="eyebrow">Player profile</div><h2>${p.name}</h2><div class="playerMeta">${meta}${p.previousSchool?'<br>Previous: '+p.previousSchool:''}</div><p class="bioSnippet" style="font-size:12px;min-height:0">${p.bio||'Biography not yet loaded.'}</p>${p.profile?`<a class="profileLink" href="${p.profile}" target="_blank" rel="noopener">Official biography ↗</a>`:''}<div class="metrics" style="margin-top:14px">${metrics}</div></div></div><div class="splitGrid" style="margin-top:14px"><div class="card"><div class="eyebrow">By hash</div>${splits}</div><div class="card"><div class="eyebrow">Results</div>${bars(countBy(rs,'pff_KICKRESULT'))||'<div class="empty">No results.</div>'}</div><div class="card"><div class="eyebrow">Direction</div>${bars(countBy(rs,'pff_KICKDIRACTUAL'))||'<div class="empty">No direction data.</div>'}</div></div><div class="card scroll" style="margin-top:14px"><div class="eyebrow">Underlying plays</div>${table(rs)}</div></div>`}
function playerPage(a){let lists={kickReturners:returnerFullStats(a,'KICKOFF'),puntReturners:returnerFullStats(a,'PUNT'),kickers:specialistFullStats(a,'kicker'),punters:specialistFullStats(a,'punter')},list=lists[playerCategory]||[];let labels={kickReturners:'Kick Returners',puntReturners:'Punt Returners',kickers:'Kickers',punters:'Punters'};return reportBanner('Player Intelligence')+title('Player Intelligence','A separate dashboard for returners, kickers and punters. Only roster-matched players from the selected PFF team are shown.')+`<div class="card"><div class="context">Active PFF team: <b>${selectedTeam()||'None selected'}</b>. Loaded roster: <b>${rosterData.length}</b> players. Specialist cards require both an exact PFF team-code match and an eligible roster position.</div></div>`+rosterManager()+categoryTabs()+`<div class="card"><div class="eyebrow">${labels[playerCategory]}</div><div class="playerCardGrid" style="margin-top:10px">${list.length?list.map(x=>cardForCategory(x,playerCategory)).join(''):'<div class="empty">No player data match the active team, season and week filters.</div>'}</div></div><div style="margin-top:14px">${selectedProfile(a,playerCategory,list)}</div>`}

function truthyResult(r,needle){return String(v(r,'pff_KICKRESULT')).toUpperCase().includes(needle)}
function safeMax(vals){vals=vals.filter(x=>x!=null&&Number.isFinite(x));return vals.length?Math.max(...vals):null}
function safeMin(vals){vals=vals.filter(x=>x!=null&&Number.isFinite(x));return vals.length?Math.min(...vals):null}
function hashLabel(h){return h==='L'?'Left':h==='C'?'Middle':'Right'}
function byHashRows(rs){return ['L','C','R'].map(h=>[h,rs.filter(r=>String(v(r,'pff_HASH')).toUpperCase()===h)])}
function metricCell(x,d=1,suffix=''){return x==null||Number.isNaN(x)?'—':fmt(x,d)+(suffix||'')}
function htmlTable(headers,rows){return `<table class="splitTable"><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((c,i)=>`<${i===0?'th':'td'}>${c}</${i===0?'th':'td'}>`).join('')}</tr>`).join('')}</tbody></table>`}
function directionalAccuracy(rs){let q=rs.filter(r=>v(r,'pff_KICKDIRINTENDED')&&v(r,'pff_KICKDIRACTUAL'));return pct(q.filter(r=>String(v(r,'pff_KICKDIRINTENDED')).toUpperCase()===String(v(r,'pff_KICKDIRACTUAL')).toUpperCase()).length,q.length)}
function kickoffHashTable(rs){return htmlTable(['Hash','KO','Avg depth','Median depth','Avg hang','Median hang','TB','TB%','Returned','Return%','Avg return','Median return','Avg result FP','Dir accuracy','Avg EPA'],byHashRows(rs).map(([h,q])=>{let ret=q.filter(r=>truthyResult(r,'RETURN')),tb=q.filter(r=>truthyResult(r,'TOUCH'));let y=ret.map(r=>n(v(r,'pff_RETURNYARDS'))).filter(x=>x!=null);return [hashLabel(h),q.length,metricCell(avg(q.map(r=>v(r,'pff_KICKDEPTH'))),1),metricCell(med(q.map(r=>v(r,'pff_KICKDEPTH'))),1),metricCell(avg(q.map(r=>v(r,'pff_HANGTIME'))),2),metricCell(med(q.map(r=>v(r,'pff_HANGTIME'))),2),tb.length,pct(tb.length,q.length),ret.length,pct(ret.length,q.length),metricCell(avg(y),1),metricCell(med(y),1),metricCell(avg(q.map(resultFP)),1),directionalAccuracy(q),metricCell(avg(q.map(r=>v(r,'pff_EXPECTED_POINTS_ADDED'))),3)]}))}
function kickoffReturnHashTable(rs){return htmlTable(['Hash','Opps','Returns','Avg','Median','Long','20+%','0-or-less%','Avg depth faced','Avg hang faced','Avg start FP','Avg EPA'],byHashRows(rs).map(([h,q])=>{let ret=q.filter(r=>truthyResult(r,'RETURN')),y=ret.map(r=>n(v(r,'pff_RETURNYARDS'))).filter(x=>x!=null);return [hashLabel(h),q.length,ret.length,metricCell(avg(y),1),metricCell(med(y),1),metricCell(safeMax(y),0),pct(y.filter(x=>x>=20).length,y.length),pct(y.filter(x=>x<=0).length,y.length),metricCell(avg(q.map(r=>v(r,'pff_KICKDEPTH'))),1),metricCell(avg(q.map(r=>v(r,'pff_HANGTIME'))),2),metricCell(avg(q.map(resultFP)),1),metricCell(avg(q.map(r=>v(r,'pff_EXPECTED_POINTS_ADDED'))),3)]}))}
function puntNet(r){let g=n(v(r,'pff_KICKYARDS')),ry=n(v(r,'pff_RETURNYARDS'))||0;return g==null?null:g-ry}
function puntHashTable(rs){return htmlTable(['Hash','Punts','Gross','Net','Avg hang','Median hang','Avg op','Median op','Fast','Slow','Return%','Avg return','FC%','TB%','In 20%','In 10%','Avg result FP','Avg EPA'],byHashRows(rs).map(([h,q])=>{let ret=q.filter(r=>truthyResult(r,'RETURN')),fc=q.filter(r=>truthyResult(r,'FAIR')),tb=q.filter(r=>truthyResult(r,'TOUCH')),fp=q.map(resultFP).filter(x=>x!=null),ops=q.map(r=>n(v(r,'pff_OPERATIONTIME'))).filter(x=>x!=null);return [hashLabel(h),q.length,metricCell(avg(q.map(r=>v(r,'pff_KICKYARDS'))),1),metricCell(avg(q.map(puntNet)),1),metricCell(avg(q.map(r=>v(r,'pff_HANGTIME'))),2),metricCell(med(q.map(r=>v(r,'pff_HANGTIME'))),2),metricCell(avg(ops),2),metricCell(med(ops),2),metricCell(safeMin(ops),2),metricCell(safeMax(ops),2),pct(ret.length,q.length),metricCell(avg(ret.map(r=>v(r,'pff_RETURNYARDS'))),1),pct(fc.length,q.length),pct(tb.length,q.length),pct(fp.filter(x=>x<=20).length,fp.length),pct(fp.filter(x=>x<=10).length,fp.length),metricCell(avg(fp),1),metricCell(avg(q.map(r=>v(r,'pff_EXPECTED_POINTS_ADDED'))),3)]}))}
function puntReturnHashTable(rs){return htmlTable(['Hash','Opps','Returns','Avg','Median','Long','20+%','0-or-less%','Fair catch%','Avg gross faced','Avg hang faced','Avg op faced','Avg result FP','Avg EPA'],byHashRows(rs).map(([h,q])=>{let ret=q.filter(r=>truthyResult(r,'RETURN')),fc=q.filter(r=>truthyResult(r,'FAIR')),y=ret.map(r=>n(v(r,'pff_RETURNYARDS'))).filter(x=>x!=null);return [hashLabel(h),q.length,ret.length,metricCell(avg(y),1),metricCell(med(y),1),metricCell(safeMax(y),0),pct(y.filter(x=>x>=20).length,y.length),pct(y.filter(x=>x<=0).length,y.length),pct(fc.length,q.length),metricCell(avg(q.map(r=>v(r,'pff_KICKYARDS'))),1),metricCell(avg(q.map(r=>v(r,'pff_HANGTIME'))),2),metricCell(avg(q.map(r=>v(r,'pff_OPERATIONTIME'))),2),metricCell(avg(q.map(resultFP)),1),metricCell(avg(q.map(r=>v(r,'pff_EXPECTED_POINTS_ADDED'))),3)]}))}
function fgHashTable(rs){return htmlTable(['Hash','Attempts','Made','FG%','Avg distance','Median distance','Long made','Avg op','Median op','Fast op','Slow op','Avg EPA'],byHashRows(rs).map(([h,q])=>{let made=q.filter(r=>truthyResult(r,'MADE')),d=q.map(r=>n(v(r,'pff_KICKYARDS'))).filter(x=>x!=null),md=made.map(r=>n(v(r,'pff_KICKYARDS'))).filter(x=>x!=null),ops=q.map(r=>n(v(r,'pff_FGOPTIME'))).filter(x=>x!=null);return [hashLabel(h),q.length,made.length,pct(made.length,q.length),metricCell(avg(d),1),metricCell(med(d),1),metricCell(safeMax(md),0),metricCell(avg(ops),2),metricCell(med(ops),2),metricCell(safeMin(ops),2),metricCell(safeMax(ops),2),metricCell(avg(q.map(r=>v(r,'pff_EXPECTED_POINTS_ADDED'))),3)]}))}
function xpHashTable(rs){return htmlTable(['Hash','Attempts','Made','XP%','Avg op','Median op'],byHashRows(rs).map(([h,q])=>{let made=q.filter(r=>truthyResult(r,'MADE')),ops=q.map(r=>n(v(r,'pff_FGOPTIME'))).filter(x=>x!=null);return [hashLabel(h),q.length,made.length,pct(made.length,q.length),metricCell(avg(ops),2),metricCell(med(ops),2)]}))}
function hashIntelligencePage(a){let team=selectedTeam(),own=(unit,side)=>a.filter(r=>v(r,'pff_SPECIALTEAMSTYPE')===unit&&(!team||v(r,side==='kick'?'pff_OFFTEAM':'pff_DEFTEAM')===team));let ko=own('KICKOFF','return'),kor=own('KICKOFF','kick'),p=own('PUNT','kick'),pr=own('PUNT','return'),fg=own('FIELD GOAL','kick'),xp=own('EXTRA POINT','kick');let context=team?`Team: ${team}`:'All teams';return reportBanner('Hash Intelligence Report')+title('Hash Intelligence','Every major special-teams metric split by left, middle and right hash. These tables use the active season, week and team filters.')+`<div class="card"><div class="eyebrow">Report context</div><div class="context">${context}. Kickoff and punt unit ownership is applied correctly for kicking and return teams.</div></div><div class="card pageBreak"><h3>Kickoff coverage by hash</h3>${kickoffHashTable(ko)}</div><div class="card pageBreak"><h3>Kickoff return by hash</h3>${kickoffReturnHashTable(kor)}</div><div class="card pageBreak"><h3>Punt unit by hash</h3>${puntHashTable(p)}</div><div class="card pageBreak"><h3>Punt return by hash</h3>${puntReturnHashTable(pr)}</div><div class="card pageBreak"><h3>Field goals by hash</h3>${fgHashTable(fg)}</div><div class="card pageBreak"><h3>Extra points by hash</h3>${xpHashTable(xp)}</div>`}

function render(){
  const a=filtered();
  const app=$('app');
  if(!app)return;
  app.innerHTML=
    page==='dashboard'?dashboard(a):
    page==='hash'?hashIntelligencePage(a):
    page==='spray'?spray(a):
    page==='viewer'?viewer(a):
    page==='chart'?chartPage(a):
    page==='library'?libraryPage(a):
    page==='players'?playerPage(a):
    page==='relationships'?relationshipPage(a):
    page==='families'?families(a):
    page==='settings'?teamSettingsPage():
    title('Play Log','All filtered special-teams plays')+table(a);
  bind();
}

function loadRosterFile(f){if(!f)return;let rd=new FileReader();rd.onload=()=>{try{let x=f.name.toLowerCase().endsWith('.json')?JSON.parse(rd.result):parseRosterCSV(rd.result);if(!Array.isArray(x)||!x.length)throw new Error('No roster rows found');rosterData=x;saveRoster();rosterStatus='Roster file loaded: '+x.length+' players.';saveTeamSettings();render();alert('Roster loaded: '+x.length+' players')}catch(err){alert('Roster load failed: '+err.message)}};rd.readAsText(f)}

function bind(){let sc=$('saveCloudBtn');if(sc)sc.onclick=saveProjectCloud;let cs=$('copyShareBtn');if(cs)cs.onclick=copyShareLink;let tsb=$('teamSettingsBtn');if(tsb)tsb.onclick=()=>{page='settings';document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.page==='settings'));render()};let saveTS=$('saveTeamSettingsBtn');if(saveTS)saveTS.onclick=()=>{let next={...teamSettings,teamName:$('teamNameSetting').value.trim(),nickname:$('nicknameSetting').value.trim(),teamCode:$('teamCodeSetting').value.trim(),rosterUrl:$('rosterUrlSetting').value.trim()};let changed=[teamSettings.teamName,teamSettings.nickname,teamSettings.teamCode,teamSettings.rosterUrl].join('|')!==[next.teamName,next.nickname,next.teamCode,next.rosterUrl].join('|');teamSettings=next;if(changed&&rosterData.length){rosterData=[];saveRoster();selectedSpecialist='';rosterStatus='Team changed. The prior roster was cleared to prevent players from the previous program carrying over.'}else{rosterStatus='Team and roster source saved.'}saveTeamSettings();setup();if($('teamF')&&[...$('teamF').options].some(o=>o.value===teamSettings.teamCode))$('teamF').value=teamSettings.teamCode;if($('weekF'))$('weekF').value='';if($('unitF'))$('unitF').value='';render()};let refreshURL=$('refreshRosterUrlBtn');if(refreshURL)refreshURL.onclick=()=>{teamSettings.rosterUrl=$('rosterUrlSetting').value.trim();saveTeamSettings();refreshRosterFromUrl()};let clearTR=$('clearTeamRoster');if(clearTR)clearTR.onclick=()=>{teamSettings={...DEFAULT_TEAM_SETTINGS};rosterData=[];selectedSpecialist='';saveRoster();rosterStatus='Team and roster cleared. Enter the next program and roster URL.';saveTeamSettings();render()};let exportRS=$('exportRosterSettings');if(exportRS)exportRS.onclick=()=>{let blob=new Blob([JSON.stringify(rosterData,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=(teamSettings.nickname||teamSettings.teamCode||'team').toLowerCase().replace(/[^a-z0-9]+/g,'-')+'-roster-current.json';a.click();URL.revokeObjectURL(u)};let sri=$('settingsRosterInput');if(sri)sri.onchange=e=>loadRosterFile(e.target.files[0]);let rb=$('reportModeBtn');if(rb)rb.onclick=()=>{document.body.classList.toggle('report-mode');rb.textContent=document.body.classList.contains('report-mode')?'Exit Report Mode':'Report Mode'};let pb=$('printBtn');if(pb)pb.onclick=()=>window.print();document.querySelectorAll('[data-pcat]').forEach(b=>b.onclick=()=>{playerCategory=b.dataset.pcat;selectedSpecialist='';render()});document.querySelectorAll('.playerSelect').forEach(c=>c.onclick=()=>{selectedSpecialist=c.dataset.playernum;render()});let ri=$('rosterInput');if(ri)ri.onchange=e=>loadRosterFile(e.target.files[0]);let er=$('exportRoster');if(er)er.onclick=()=>{let blob=new Blob([JSON.stringify(rosterData,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=(teamSettings.nickname||teamSettings.teamCode||'team').toLowerCase().replace(/[^a-z0-9]+/g,'-')+'-roster-player-cards.json';a.click();URL.revokeObjectURL(u)};let rr=$('resetRoster');if(rr)rr.onclick=()=>{rosterData=[];saveRoster();rosterStatus='Roster cleared.';saveTeamSettings();render()};['dashKoHash','dashPuntHash','dashFgHash'].forEach(id=>{let e=$(id);if(e)e.onchange=()=>{if(id==='dashKoHash')dashKoHash=e.value;if(id==='dashPuntHash')dashPuntHash=e.value;if(id==='dashFgHash')dashFgHash=e.value;render()}});document.querySelectorAll('.unitBtn').forEach(b=>b.onclick=()=>{viewType=b.dataset.t;viewSide=b.dataset.s;playIndex=0;chartIndex=0;chartPositions={};render()});let p=$('prevPlay'),nxt=$('nextPlay');if(p)p.onclick=()=>{let x=unitRows(filtered());playIndex=(playIndex-1+x.length)%x.length;render()};if(nxt)nxt.onclick=()=>{let x=unitRows(filtered());playIndex=(playIndex+1)%x.length;render()};let cp=$('chartPrev'),cn=$('chartNext');if(cp)cp.onclick=()=>{let x=chartPlays(filtered());chartIndex=(chartIndex-1+x.length)%x.length;chartPositions={};render()};if(cn)cn.onclick=()=>{let x=chartPlays(filtered());chartIndex=(chartIndex+1)%x.length;chartPositions={};render()};if($('resetChart'))$('resetChart').onclick=()=>{let r=activeChartPlay(filtered());chartPositions=defaultPositions(r);render()};if($('copyPrev'))$('copyPrev').onclick=()=>{let x=chartPlays(filtered()),pr=x[(chartIndex-1+x.length)%x.length];chartPositions=defaultPositions(pr);let pk=playKey(pr),as=repAssignments[pk],look=as&&savedLooks.find(l=>l.id===as.lookId);if(look)chartPositions=Object.fromEntries(look.positions.map(p=>[p.role+'|'+p.name,{...p}]));render()};if($('mirrorChart'))$('mirrorChart').onclick=()=>{Object.values(chartPositions).forEach(p=>p.x=100-p.x);render()};if($('saveNewLook'))$('saveNewLook').onclick=()=>saveNewLook(activeChartPlay(filtered()));if($('assignBest'))$('assignBest').onclick=()=>assignBest(activeChartPlay(filtered()));if($('exportLooks'))$('exportLooks').onclick=exportLookData;document.querySelectorAll('.showReps').forEach(b=>b.onclick=()=>$('reps_'+b.dataset.id).parentElement.classList.toggle('open'));document.querySelectorAll('.deleteLook').forEach(b=>b.onclick=()=>{let id=b.dataset.id;savedLooks=savedLooks.filter(l=>l.id!==id);Object.keys(repAssignments).forEach(k=>{if(repAssignments[k].lookId===id)delete repAssignments[k]});persistLooks();render()});document.querySelectorAll('.loadLook').forEach(b=>b.onclick=()=>{let l=savedLooks.find(x=>x.id===b.dataset.id);if(!l)return;viewType=l.unit;viewSide=l.side;chartPositions=Object.fromEntries(l.positions.map(p=>[p.role+'|'+p.name,{...p}]));page='chart';document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.page==='chart'));render()});bindChartDrag();if(typeof bindPlayerPages==='function')bindPlayerPages()}
document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));b.classList.add('active');page=b.dataset.page;playIndex=0;chartIndex=0;chartPositions={};render()});
document.querySelectorAll('.toolbar select').forEach(e=>e.onchange=()=>{playIndex=0;chartIndex=0;chartPositions={};render()});$('resetF').onclick=()=>{['seasonF','weekF','teamF','unitF'].forEach(id=>$(id).value='');dashKoHash='';dashPuntHash='';dashFgHash='';playIndex=0;render()};
$('fileInput').onchange=async e=>{let f=e.target.files[0];if(!f)return;rows=parseCSV(await f.text());setup();playIndex=0;chartIndex=0;chartPositions={};render()};(async()=>{await loadProjectCloud();setup();render()})();
</script>
